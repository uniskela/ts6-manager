# Local stack for testing a PR branch (builds from the current checkout).
#
# Includes a TeamSpeak 6 server on the same Docker network as ts6-manager.
#
# Quick start:
#   cp .env.pr-test.example .env
#   docker compose -f docker-compose.pr-test.yml up --build
#
# Then open http://localhost:3000/setup and complete admin setup.
# Settings → Connections → Start setup wizard:
#   Scenario: "Both in Docker (separate stacks)"
#   Host: teamspeak
#   WebQuery port: 10080
#   API key: create on the TS server (see below)
#
# TeamSpeak query login (for creating an API key):
#   Username: serveradmin
#   Password: value of TS_PR_TEST_ADMIN_PASSWORD in .env (default: testadmin)
#   Check TS logs for the initial privilege key on first boot:
#     docker compose -f docker-compose.pr-test.yml logs teamspeak
#
# Optional: connect a TS client to voice on UDP 9987.
#
# Tear down:
#   docker compose -f docker-compose.pr-test.yml down
#   docker compose -f docker-compose.pr-test.yml down -v   # also remove volumes

services:
  teamspeak:
    image: teamspeaksystems/teamspeak6-server:latest
    container_name: ts6-pr-teamspeak
    restart: unless-stopped
    environment:
      TSSERVER_LICENSE_ACCEPTED: accept
      TSSERVER_QUERY_HTTP_ENABLED: "1"
      TSSERVER_QUERY_HTTP_PORT: "10080"
      TSSERVER_QUERY_SSH_ENABLED: "1"
      TSSERVER_QUERY_SSH_PORT: "10022"
      TSSERVER_QUERY_ADMIN_PASSWORD: ${TS_PR_TEST_ADMIN_PASSWORD:-testadmin}
    volumes:
      - pr-test-teamspeak-data:/var/tsserver
    ports:
      - "9987:9987/udp"
      - "30033:30033/tcp"
      - "10022:10022/tcp"   # SSH ServerQuery — create API keys from your host
    networks:
      - ts6-pr-test

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        GIT_SHA: ${GIT_SHA:-pr-test}
    container_name: ts6-pr-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/app/packages/backend/data/ts6webui.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SIDECAR_SECRET: ${SIDECAR_SECRET:?Set SIDECAR_SECRET in .env}
      SIDECAR_URL: http://sidecar:9800
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
      MUSIC_DIR: /data/music
      TS_ALLOW_SELF_SIGNED: ${TS_ALLOW_SELF_SIGNED:-true}
      TS_ALLOW_PRIVATE_HOSTS: ${TS_ALLOW_PRIVATE_HOSTS:-true}
    volumes:
      - pr-test-backend-data:/app/packages/backend/data
      - pr-test-music-data:/data/music
    # API is proxied through the frontend on :3000 — only publish 3001 if you need direct API access.
    # ports:
    #   - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sidecar:
        condition: service_started
      teamspeak:
        condition: service_started
    networks:
      - ts6-pr-test

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: ts6-pr-sidecar
    restart: unless-stopped
    environment:
      SIDECAR_PORT: 9800
      SIDECAR_SECRET: ${SIDECAR_SECRET:?Set SIDECAR_SECRET in .env}
    networks:
      - ts6-pr-test

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        GIT_SHA: ${GIT_SHA:-pr-test}
    container_name: ts6-pr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ts6-pr-test

volumes:
  pr-test-backend-data:
  pr-test-music-data:
  pr-test-teamspeak-data:

networks:
  ts6-pr-test:
    driver: bridge
