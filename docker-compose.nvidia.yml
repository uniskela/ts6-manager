# NVIDIA (NVENC) hardware encoding — an override, layered on another compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# Then pick "H.264 (NVENC)" as the encoder, or leave it on Auto with
# "Auto prefers hardware" on (Streaming defaults → Check encoders shows whether
# the NVENC test encode passes).
#
# It is a separate file because the GPU reservation below makes Compose refuse
# to start on a host without the NVIDIA runtime ("could not select device
# driver nvidia"), which would break every Intel, AMD and CPU-only install if
# it lived in the main files.
#
# The host needs the NVIDIA driver and the NVIDIA Container Toolkit
# (nvidia-container-toolkit, then `nvidia-ctk runtime configure --runtime=docker`).
# The image needs nothing extra: its FFmpeg already has h264_nvenc, and loads
# the driver's encode and decode libraries, which the toolkit mounts in.
services:
  sidecar:
    environment:
      # "video" is the capability that mounts libnvidia-encode and libnvcuvid;
      # without it the GPU is visible but NVENC fails to load.
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # Optional: also decode the source on the GPU (-hwaccel cuda).
      # VIDEO_HW_DECODE: "1"
    deploy:
      resources:
        reservations:
          devices:
            # One GPU. On a multi-GPU host, replace count with
            # device_ids: ["1"] to pick another; inside the container it is
            # always GPU 0.
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
