name: Temporary consolidated dependency lockfile regeneration
on:
  push:
    branches:
      - chore/consolidate-oct2026-npm-updates
permissions:
  contents: write
jobs:
  refresh-lockfile:
    if: github.event.head_commit.message != 'chore(deps): refresh consolidated pnpm lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate lockfile using the checked-in overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify frozen lockfile consistency
        run: pnpm install --frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): refresh consolidated pnpm lockfile'
            git push origin HEAD:refs/heads/chore/consolidate-oct2026-npm-updates
          fi
