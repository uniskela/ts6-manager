name: Temporary Zod 4 source compatibility audit
on:
  push:
    branches:
      - chore/consolidate-oct2026-npm-updates
jobs:
  audit-zod-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all Zod consumers and risky APIs
        shell: bash
        run: |
          echo '=== imports, module loaders, and resolver integrations ==='
          git grep -n -i 'zod' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' || true
          echo '=== Zod 3 migration hot spots ==='
          git grep -nE '\.(errors|formErrors|deepPartial|nonstrict|errorMap|superRefine|transform|default|safeParse|strict|passthrough|flatten|format)\(|z\.(record|function|nativeEnum|coerce|intersection|any|unknown)\(' -- packages/backend/src packages/frontend/src packages/common || true
          echo '=== dependency declarations ==='
          git grep -n -e '"zod"' -e '"@hookform/resolvers"' -- '*/package.json' 'packages/*/package.json' || true
