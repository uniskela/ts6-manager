# Manual, maintainer-approved publish of a PRIVATE GHCR preview for Bridge-D1.
# Lives on main only. Does not import Bridge-D1 runtime. Not called from Release Please.
# Does not publish latest/stable or Docker Hub. Does not alter release image workflows.
#
# Unprivileged build: checkout the approved PR #504 SHA, build, test, save a checksummed image.
# Privileged publish: download that artifact, verify, load, push. No Dockerfile, no PR scripts.
name: Publish private-beta discord-bridge

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA that must already be on draft PR 504
        required: true
        type: string
      confirm:
        description: Must equal publish-private-beta-<full-sha>
        required: true
        type: string

concurrency:
  group: ghcr-discord-bridge-private-beta-${{ inputs.commit }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ts6-manager/discord-bridge
  PACKAGE_NAME: ts6-manager/discord-bridge
  SOURCE_PR: "504"

jobs:
  verify-and-build:
    name: Verify SHA and build locally
    if: github.repository == 'uniskela/ts6-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.sha.outputs.tag }}
      tarball_sha256: ${{ steps.artifact.outputs.tarball_sha256 }}
    steps:
      - name: Validate commit and confirm token
        id: sha
        env:
          COMMIT: ${{ inputs.commit }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character lowercase SHA" >&2
            exit 1
          fi
          expected="publish-private-beta-${COMMIT}"
          if [ "$CONFIRM" != "$expected" ]; then
            echo "confirm must be publish-private-beta-<full-sha>" >&2
            exit 1
          fi
          echo "sha=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "tag=private-beta-${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Verify commit belongs to PR 504
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.sha.outputs.sha }}
          REPO: ${{ github.repository }}
          SOURCE_PR: ${{ env.SOURCE_PR }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${REPO}/pulls/${SOURCE_PR}")"
          python3 - "$COMMIT" "$REPO" "$SOURCE_PR" <<'PY'
          import json, os, subprocess, sys
          commit, repo, source_pr = sys.argv[1], sys.argv[2], sys.argv[3]
          meta = json.loads(sys.stdin.read())
          if meta.get("state") != "open":
              raise SystemExit(f"PR #{source_pr} must be open")
          head = ((meta.get("head") or {}).get("repo") or {}).get("full_name")
          if head != repo:
              raise SystemExit(f"PR #{source_pr} must be from {repo}")
          shas = []
          page = 1
          while True:
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/pulls/{source_pr}/commits?per_page=100&page={page}"],
                  text=True,
              )
              batch = json.loads(raw)
              if not batch:
                  break
              shas.extend(item.get("sha") for item in batch)
              if len(batch) < 100:
                  break
              page += 1
          if commit not in shas:
              raise SystemExit(f"{commit} is not a commit on PR #{source_pr}")
          print(f"commit {commit} is on open PR #{source_pr}")
          PY

      - name: Checkout approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Verify exact HEAD
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          got="$(git rev-parse HEAD)"
          if [ "$got" != "$COMMIT" ]; then
            echo "HEAD ${got} is not the approved commit" >&2
            exit 1
          fi

      - name: Build image (no registry login)
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          set -euo pipefail
          docker build -f packages/discord-bridge/lab/Dockerfile \
            --build-arg SOURCE_COMMIT="$COMMIT" \
            -t "ts6-discord-bridge-private-beta:${COMMIT}" \
            -t "${IMAGE_NAME}:${TAG}" \
            .

      - name: Container security and mount probe
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          packages/discord-bridge/scripts/container-runtime-test.sh "ts6-discord-bridge-private-beta:${COMMIT}"
          packages/discord-bridge/scripts/private-beta-container-test.sh "ts6-discord-bridge-private-beta:${COMMIT}"
          rev="$(docker image inspect "ts6-discord-bridge-private-beta:${COMMIT}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "$rev" = "$COMMIT" ]

      - name: Save verified image artifact
        id: artifact
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verified-image
          docker save \
            "ts6-discord-bridge-private-beta:${COMMIT}" \
            "${IMAGE_NAME}:${TAG}" \
            | gzip > verified-image/image.tar.gz
          tarball_sha256="$(sha256sum verified-image/image.tar.gz | awk '{print $1}')"
          printf '%s\n' "$tarball_sha256" > verified-image/image.tar.gz.sha256
          rev="$(docker image inspect "ts6-discord-bridge-private-beta:${COMMIT}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          image_id="$(docker image inspect "ts6-discord-bridge-private-beta:${COMMIT}" --format '{{.Id}}')"
          python3 - "$COMMIT" "$TAG" "$tarball_sha256" "$rev" "$image_id" <<'PY'
          import json, sys
          commit, tag, digest, rev, image_id = sys.argv[1:]
          if rev != commit:
              raise SystemExit(f"OCI revision {rev} != {commit}")
          with open("verified-image/provenance.json", "w", encoding="utf-8") as fh:
              json.dump(
                  {
                      "source_sha": commit,
                      "tag": tag,
                      "tarball_sha256": digest,
                      "oci_revision": rev,
                      "image_id": image_id,
                  },
                  fh,
                  indent=2,
              )
              fh.write("\n")
          PY
          echo "tarball_sha256=${tarball_sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload verified image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discord-bridge-private-beta
          path: verified-image/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Push verified artifact after approval
    if: github.repository == 'uniskela/ts6-manager'
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: discord-bridge-private-beta
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Refuse mutable tags
        env:
          TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            latest|stable|*public*|*manager*) echo "refusing tag $TAG" >&2; exit 1 ;;
          esac
          if [[ ! "$TAG" =~ ^private-beta-[0-9a-f]{40}$ ]]; then
            echo "tag must be private-beta-<full-sha>" >&2
            exit 1
          fi

      - name: Re-verify commit belongs to PR 504
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.verify-and-build.outputs.sha }}
          REPO: ${{ github.repository }}
          SOURCE_PR: ${{ env.SOURCE_PR }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${REPO}/pulls/${SOURCE_PR}")"
          python3 - "$COMMIT" "$REPO" "$SOURCE_PR" <<'PY'
          import json, subprocess, sys
          commit, repo, source_pr = sys.argv[1], sys.argv[2], sys.argv[3]
          meta = json.loads(sys.stdin.read())
          if meta.get("state") != "open":
              raise SystemExit(f"PR #{source_pr} must be open")
          head = ((meta.get("head") or {}).get("repo") or {}).get("full_name")
          if head != repo:
              raise SystemExit(f"PR #{source_pr} must be from {repo}")
          shas = []
          page = 1
          while True:
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/pulls/{source_pr}/commits?per_page=100&page={page}"],
                  text=True,
              )
              batch = json.loads(raw)
              if not batch:
                  break
              shas.extend(item.get("sha") for item in batch)
              if len(batch) < 100:
                  break
              page += 1
          if commit not in shas:
              raise SystemExit(f"{commit} is not a commit on PR #{source_pr}")
          print(f"commit {commit} is on open PR #{source_pr}")
          PY

      - name: Download verified image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: discord-bridge-private-beta
          path: verified-image

      - name: Verify artifact checksum and load the same image
        env:
          COMMIT: ${{ needs.verify-and-build.outputs.sha }}
          TAG: ${{ needs.verify-and-build.outputs.tag }}
          EXPECTED_SHA256: ${{ needs.verify-and-build.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          if [ -e packages/discord-bridge ] || [ -e Dockerfile ] || [ -e packages/discord-bridge/lab/Dockerfile ]; then
            echo "publish job must not have repository build context" >&2
            exit 1
          fi
          got="$(sha256sum verified-image/image.tar.gz | awk '{print $1}')"
          listed="$(tr -d '[:space:]' < verified-image/image.tar.gz.sha256)"
          python3 - "$COMMIT" "$TAG" "$EXPECTED_SHA256" "$got" "$listed" <<'PY'
          import json, sys
          commit, tag, expected, got, listed = sys.argv[1:]
          prov = json.load(open("verified-image/provenance.json", encoding="utf-8"))
          for key, value in (
              ("source_sha", commit),
              ("tag", tag),
              ("tarball_sha256", expected),
              ("oci_revision", commit),
          ):
              if prov.get(key) != value:
                  raise SystemExit(f"provenance {key}={prov.get(key)!r} != {value!r}")
          if got != expected or listed != expected:
              raise SystemExit("artifact checksum mismatch")
          print("artifact checksum and provenance match")
          PY
          gzip -dc verified-image/image.tar.gz | docker load
          rev="$(docker image inspect "${IMAGE_NAME}:${TAG}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [ "$rev" != "$COMMIT" ]; then
            echo "loaded image revision ${rev} != ${COMMIT}" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse public package or existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$OWNER" "$PACKAGE_NAME" "$TAG" <<'PY'
          import json, subprocess, sys
          owner, name, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          encoded = name.replace("/", "%2F")

          def api(path):
              proc = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if proc.returncode != 0:
                  err = proc.stderr + proc.stdout
                  if "404" in err or "Not Found" in err or "Package not found" in err:
                      return None
                  raise SystemExit(err or f"gh api failed: {path}")
              return json.loads(proc.stdout)

          info = api(f"users/{owner}/packages/container/{encoded}")
          scope = "users"
          if info is None:
              info = api(f"orgs/{owner}/packages/container/{encoded}")
              scope = "orgs"
          if info is None:
              print("package does not exist yet; first push must become private")
              sys.exit(0)
          vis = info.get("visibility")
          print(f"visibility={vis}")
          if vis != "private":
              raise SystemExit("package must stay private; refusing an existing public package")
          versions = []
          page = 1
          while True:
              batch = api(f"{scope}/{owner}/packages/container/{encoded}/versions?per_page=100&page={page}")
              if not batch:
                  break
              versions.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          tags = []
          for version in versions:
              tags.extend(((version.get("metadata") or {}).get("container") or {}).get("tags") or [])
          if tag in tags:
              raise SystemExit(f"refusing to overwrite existing tag {tag}")
          print(f"tag {tag} is free")
          PY

      - name: Push commit-specific tag only
        env:
          TAG: ${{ needs.verify-and-build.outputs.tag }}
          COMMIT: ${{ needs.verify-and-build.outputs.sha }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${TAG}"
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest",""))')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "missing image digest" >&2
            exit 1
          fi
          echo "published ${IMAGE_NAME}:${TAG}"
          echo "digest=${digest}"
          echo "source=${COMMIT}"
          echo "digest=${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=${IMAGE_NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "pin=${IMAGE_NAME}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Enforce private visibility and deny anonymous pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$OWNER" "$PACKAGE_NAME" "$IMAGE_NAME" "$TAG" "${DIGEST:-}" <<'PY'
          import json, subprocess, sys, urllib.request
          owner, name, image, tag, digest = sys.argv[1:6]
          encoded = name.replace("/", "%2F")

          def api(method, path, data=None):
              args = ["gh", "api", "--method", method, path]
              if data is not None:
                  args.extend(["--input", "-"])
              proc = subprocess.run(
                  args,
                  input=json.dumps(data) if data is not None else None,
                  capture_output=True,
                  text=True,
              )
              return proc.returncode, proc.stdout, proc.stderr + proc.stdout

          def visibility():
              for path in (
                  f"users/{owner}/packages/container/{encoded}",
                  f"orgs/{owner}/packages/container/{encoded}",
              ):
                  code, out, err = api("GET", path)
                  if code == 0:
                      return json.loads(out).get("visibility"), path
                  if "404" not in err and "Not Found" not in err and "Package not found" not in err:
                      raise SystemExit(err)
              raise SystemExit("package missing after push")

          vis, path = visibility()
          if vis != "private":
              for method, candidate, body in (
                  ("POST", f"user/packages/container/{encoded}", {"visibility": "private"}),
                  ("POST", f"users/{owner}/packages/container/{encoded}", {"visibility": "private"}),
                  ("PATCH", path, {"visibility": "private"}),
              ):
                  api(method, candidate, body)
              vis, path = visibility()
          print(f"visibility={vis}")
          if vis != "private":
              raise SystemExit("package must be private after publish")

          url = f"https://ghcr.io/v2/{owner}/{name}/manifests/{tag}"
          req = urllib.request.Request(url, method="GET", headers={"Accept": "application/vnd.oci.image.manifest.v1+json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  code = resp.status
          except urllib.error.HTTPError as exc:
              code = exc.code
          print(f"anonymous_manifest_status={code}")
          if code not in (401, 403, 404):
              raise SystemExit(f"anonymous pull must be denied, got HTTP {code}")
          if digest:
              print(f"digest={digest}")
          print(f"pin={image}@{digest}" if digest else f"tag={image}:{tag}")
          PY
