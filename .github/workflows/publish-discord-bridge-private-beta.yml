# Manual, maintainer-approved publish of a PRIVATE GHCR preview for Bridge-D1.
# Lives on main only. Does not import Bridge-D1 runtime. Not called from Release Please.
# Does not publish latest/stable or Docker Hub. Does not alter release image workflows.
#
# Trust model: docs/internal/discord-bridge-private-beta-publish.md
# Reduced-trust private preview. Attestation proves GitHub signed these tarball
# bytes for this workflow identity. It does not prove they were built from the
# dispatch SHA. Do not treat this as production provenance.
name: Publish private-beta discord-bridge

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA that must already be on draft PR 504
        required: true
        type: string
      confirm:
        description: Must equal publish-private-beta-<full-sha>
        required: true
        type: string

concurrency:
  group: ghcr-discord-bridge-private-beta-${{ inputs.commit }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ts6-manager/discord-bridge
  PACKAGE_NAME: ts6-manager/discord-bridge
  SOURCE_PR: "504"
  PREDICATE_TYPE: https://github.com/uniskela/ts6-manager/private-beta-publish/v1

jobs:
  verify-and-build:
    name: Verify SHA and build locally
    if: github.repository == 'uniskela/ts6-manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - name: Validate commit and confirm token
        id: sha
        env:
          COMMIT: ${{ inputs.commit }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character lowercase SHA" >&2
            exit 1
          fi
          expected="publish-private-beta-${COMMIT}"
          if [ "$CONFIRM" != "$expected" ]; then
            echo "confirm must be publish-private-beta-<full-sha>" >&2
            exit 1
          fi
          echo "sha=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "tag=private-beta-${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify commit belongs to PR 504
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/verify_private_beta_source.py \
            --commit "${{ steps.sha.outputs.sha }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ env.SOURCE_PR }}"

      - name: Checkout approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Verify exact HEAD
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          got="$(git rev-parse HEAD)"
          if [ "$got" != "$COMMIT" ]; then
            echo "HEAD ${got} is not the approved commit" >&2
            exit 1
          fi

      - name: Build image (no registry login)
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          set -euo pipefail
          docker build -f packages/discord-bridge/lab/Dockerfile \
            --build-arg SOURCE_COMMIT="$COMMIT" \
            -t "ts6-discord-bridge-private-beta:${COMMIT}" \
            -t "${IMAGE_NAME}:${TAG}" \
            .

      - name: Save image tarball
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verified-image
          docker save \
            "ts6-discord-bridge-private-beta:${COMMIT}" \
            "${IMAGE_NAME}:${TAG}" \
            | gzip > verified-image/image.tar.gz

      - name: Upload image tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discord-bridge-private-beta
          path: verified-image/image.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Container security and mount probe
        env:
          COMMIT: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          packages/discord-bridge/scripts/container-runtime-test.sh "ts6-discord-bridge-private-beta:${COMMIT}"
          packages/discord-bridge/scripts/private-beta-container-test.sh "ts6-discord-bridge-private-beta:${COMMIT}"
          rev="$(docker image inspect "ts6-discord-bridge-private-beta:${COMMIT}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "$rev" = "$COMMIT" ]

  attest:
    name: Attest tarball without running PR or image code
    if: github.repository == 'uniskela/ts6-manager' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Re-verify commit belongs to PR 504
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/verify_private_beta_source.py \
            --commit "${{ needs.verify-and-build.outputs.sha }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ env.SOURCE_PR }}"

      - name: Download image tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: discord-bridge-private-beta
          path: verified-image

      - name: Write GitHub-injected predicate
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          python3 -c 'import json, os, pathlib; pathlib.Path("predicate.json").write_text(json.dumps({"source_sha": os.environ["COMMIT"], "source_pr": "504", "tag": "private-beta-" + os.environ["COMMIT"]}))'

      - name: Attest tarball to the GitHub-provided source SHA
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verified-image/image.tar.gz
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: predicate.json

  publish:
    name: Push attested artifact after approval
    if: github.repository == 'uniskela/ts6-manager' && github.ref == 'refs/heads/main'
    needs: [verify-and-build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: discord-bridge-private-beta
    permissions:
      contents: read
      packages: write
      pull-requests: read
      attestations: read
    steps:
      - name: Refuse mutable tags
        env:
          TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            latest|stable|*public*|*manager*) echo "refusing tag $TAG" >&2; exit 1 ;;
          esac
          if [[ ! "$TAG" =~ ^private-beta-[0-9a-f]{40}$ ]]; then
            echo "tag must be private-beta-<full-sha>" >&2
            exit 1
          fi

      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Re-verify commit belongs to PR 504
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/verify_private_beta_source.py \
            --commit "${{ needs.verify-and-build.outputs.sha }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ env.SOURCE_PR }}"

      - name: Download image tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: discord-bridge-private-beta
          path: verified-image

      - name: Verify GitHub attestation for this tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/verify_private_beta_attestation.py \
            --file verified-image/image.tar.gz \
            --commit "${{ needs.verify-and-build.outputs.sha }}" \
            --repo "${{ github.repository }}"

      - name: Require an already-private GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/verify_private_beta_ghcr.py require-private \
            --owner "${{ github.repository_owner }}" \
            --name "${{ env.PACKAGE_NAME }}" \
            --tag "${{ needs.verify-and-build.outputs.tag }}"

      - name: Load the attested image
        env:
          COMMIT: ${{ needs.verify-and-build.outputs.sha }}
          TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          gzip -dc verified-image/image.tar.gz | docker load
          rev="$(docker image inspect "${IMAGE_NAME}:${TAG}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [ "$rev" != "$COMMIT" ]; then
            echo "loaded image revision ${rev} != ${COMMIT}" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit-specific tag only
        id: push
        env:
          TAG: ${{ needs.verify-and-build.outputs.tag }}
          COMMIT: ${{ needs.verify-and-build.outputs.sha }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${TAG}"
          echo "published ${IMAGE_NAME}:${TAG}"
          echo "source=${COMMIT}"
          echo "tag=${IMAGE_NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=${COMMIT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record published digest
        env:
          TAG: ${{ needs.verify-and-build.outputs.tag }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest",""))')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "missing image digest" >&2
            exit 1
          fi
          echo "digest=${digest}"
          echo "digest=${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "pin=${IMAGE_NAME}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Confirm private visibility and deny anonymous pull
        if: ${{ always() && steps.push.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/verify_private_beta_ghcr.py verify-after-push \
            --owner "${{ github.repository_owner }}" \
            --name "${{ env.PACKAGE_NAME }}" \
            --tag "${{ needs.verify-and-build.outputs.tag }}"
          echo "digest=${DIGEST:-}"
          echo "pin=${IMAGE_NAME}@${DIGEST:-}"
