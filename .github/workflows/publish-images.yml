name: Publish container images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Invoked by Release Please after it creates a vX.Y.Z tag (GITHUB_TOKEN
  # tag/releases do not retrigger this workflow via push/release events).
  workflow_call:
    inputs:
      tag:
        description: Immutable release tag created by Release Please (vX.Y.Z).
        required: true
        type: string

concurrency:
  group: ghcr-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Images: ghcr.io/<owner>/ts6-manager/<component>
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ts6-manager

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      # Fail the matrix if any component fails so we never promote a mixed :latest set.
      fail-fast: true
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
          - component: frontend
            dockerfile: Dockerfile.frontend
          - component: sidecar
            dockerfile: Dockerfile.sidecar

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        if: github.event_name == 'workflow_call'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got: $TAG" >&2
            exit 1
          fi

      - name: Resolve image tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%.7s' "${GITHUB_SHA}")"
          {
            echo "list<<EOF"
            echo "${IMAGE_PREFIX}/${COMPONENT}:sha-${SHORT_SHA}"
            if [[ -n "${TAG}" ]]; then
              VERSION="${TAG#v}"
              MAJOR_MINOR="${VERSION%.*}"
              echo "${IMAGE_PREFIX}/${COMPONENT}:${TAG}"
              echo "${IMAGE_PREFIX}/${COMPONENT}:${VERSION}"
              echo "${IMAGE_PREFIX}/${COMPONENT}:${MAJOR_MINOR}"
            elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              MAJOR_MINOR="${VERSION%.*}"
              echo "${IMAGE_PREFIX}/${COMPONENT}:${GITHUB_REF_NAME}"
              echo "${IMAGE_PREFIX}/${COMPONENT}:${VERSION}"
              echo "${IMAGE_PREFIX}/${COMPONENT}:${MAJOR_MINOR}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # All-in-one image builds independently so a failure there does not block the 3-service stack.
  build-all-in-one:
    name: Build all-in-one
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        if: github.event_name == 'workflow_call'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got: $TAG" >&2
            exit 1
          fi

      - name: Resolve image tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%.7s' "${GITHUB_SHA}")"
          {
            echo "list<<EOF"
            echo "${IMAGE_PREFIX}/all-in-one:sha-${SHORT_SHA}"
            if [[ -n "${TAG}" ]]; then
              VERSION="${TAG#v}"
              MAJOR_MINOR="${VERSION%.*}"
              echo "${IMAGE_PREFIX}/all-in-one:${TAG}"
              echo "${IMAGE_PREFIX}/all-in-one:${VERSION}"
              echo "${IMAGE_PREFIX}/all-in-one:${MAJOR_MINOR}"
            elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              MAJOR_MINOR="${VERSION%.*}"
              echo "${IMAGE_PREFIX}/all-in-one:${GITHUB_REF_NAME}"
              echo "${IMAGE_PREFIX}/all-in-one:${VERSION}"
              echo "${IMAGE_PREFIX}/all-in-one:${MAJOR_MINOR}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/all-in-one
          tags: type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.all-in-one
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one

  # Retag the just-built sha image as :latest only when every split component built successfully.
  promote-latest:
    name: Promote ${{ matrix.component }}:latest
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_call' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend, sidecar]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag sha as latest
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%.7s' "${GITHUB_SHA}")"
          SRC="${IMAGE_PREFIX}/${COMPONENT}:sha-${SHORT_SHA}"
          DST="${IMAGE_PREFIX}/${COMPONENT}:latest"
          echo "Promoting ${SRC} → ${DST}"
          docker buildx imagetools create --tag "${DST}" "${SRC}"

  promote-all-in-one-latest:
    name: Promote all-in-one:latest
    needs: build-all-in-one
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_call' && github.ref == 'refs/heads/main'
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag sha as latest
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%.7s' "${GITHUB_SHA}")"
          SRC="${IMAGE_PREFIX}/all-in-one:sha-${SHORT_SHA}"
          DST="${IMAGE_PREFIX}/all-in-one:latest"
          echo "Promoting ${SRC} → ${DST}"
          docker buildx imagetools create --tag "${DST}" "${SRC}"

  # First publish often creates private packages; attempt to mark them public for pull-without-auth.
  # If this fails (org policy / token scope), set visibility manually under Packages → Package settings.
  make-public:
    name: Ensure packages are public
    needs: [build-and-push, build-all-in-one, promote-latest, promote-all-in-one-latest]
    runs-on: ubuntu-latest
    if: always() && (needs.build-and-push.result == 'success' || needs.build-all-in-one.result == 'success')
    permissions:
      packages: write
    steps:
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          for PKG in ts6-manager/backend ts6-manager/frontend ts6-manager/sidecar ts6-manager/all-in-one; do
            ENCODED="$(printf '%s' "$PKG" | jq -sRr @uri)"
            echo "Setting visibility public for package: $PKG"
            # User-owned packages
            if gh api --method PUT "/user/packages/container/${ENCODED}/visibility" -f visibility=public 2>/dev/null; then
              echo "OK (user): $PKG"
              continue
            fi
            # Org-owned packages
            if gh api --method PUT "/orgs/${OWNER}/packages/container/${ENCODED}/visibility" -f visibility=public 2>/dev/null; then
              echo "OK (org): $PKG"
              continue
            fi
            echo "::warning::Could not auto-set visibility for $PKG. Set it to Public in the GitHub Packages UI."
          done
