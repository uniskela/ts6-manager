name: Check yt-dlp updates

on:
  schedule:
    # Weekly freshness check. This only opens a PR; it never updates running containers.
    - cron: '43 5 * * 1'
  workflow_dispatch:

concurrency:
  group: yt-dlp-update-check
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Check latest stable yt-dlp
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read pinned version
        id: current
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < .yt-dlp-version)"
          if ! [[ "$CURRENT" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Invalid pinned yt-dlp version: $CURRENT" >&2
            exit 1
          fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Pinned yt-dlp: $CURRENT"

      - name: Resolve latest stable release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/yt-dlp/yt-dlp/releases/latest > /tmp/yt-dlp-release.json

          LATEST="$(jq -r '.tag_name' /tmp/yt-dlp-release.json)"
          DRAFT="$(jq -r '.draft' /tmp/yt-dlp-release.json)"
          PRERELEASE="$(jq -r '.prerelease' /tmp/yt-dlp-release.json)"

          if [[ "$DRAFT" != "false" || "$PRERELEASE" != "false" ]]; then
            echo "Latest release endpoint returned a draft/prerelease; refusing automated update." >&2
            exit 1
          fi
          if ! [[ "$LATEST" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Unexpected yt-dlp release tag: $LATEST" >&2
            exit 1
          fi

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable yt-dlp: $LATEST"

      - name: Decide whether an update is needed
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CURRENT" == "$LATEST" ]]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Pinned yt-dlp is current."
            exit 0
          fi

          HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n1)"
          if [[ "$HIGHEST" != "$LATEST" ]]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream latest ($LATEST) is not newer than pinned version ($CURRENT); no downgrade will be proposed."
            exit 0
          fi

          echo "needs_update=true" >> "$GITHUB_OUTPUT"

      - name: Check for an existing update PR
        if: steps.compare.outputs.needs_update == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --state open --json number,title --jq '[.[] | select(.title | startswith("fix(deps): update yt-dlp to "))][0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::yt-dlp update PR #$EXISTING is already open; not opening another."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open yt-dlp update PR
        if: steps.compare.outputs.needs_update == 'true' && steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="automation/yt-dlp-${LATEST//./-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          printf '%s\n' "$LATEST" > .yt-dlp-version
          git add .yt-dlp-version
          git commit -m "fix(deps): update yt-dlp to $LATEST"
          git push origin "$BRANCH"

          cat > /tmp/yt-dlp-pr-body.md <<EOF
          Automated yt-dlp maintenance update.

          - pinned version: $CURRENT → $LATEST
          - source: latest stable release from yt-dlp/yt-dlp
          - runtime self-updates remain disabled
          - merging this PR changes only the version pin; the normal container build/security gates validate the resulting images

          This PR is intentionally not auto-merged. Review CI and media compatibility before merging. Release Please should treat the fix(deps) squash/merge as a patch-release candidate.
          EOF

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(deps): update yt-dlp to $LATEST" \
            --body-file /tmp/yt-dlp-pr-body.md)"

          echo "Opened: $PR_URL"

          # Pull requests created with GITHUB_TOKEN do not recursively trigger
          # other workflows. Dispatch the normal validation gates explicitly.
          gh workflow run pr-validation.yml --ref "$BRANCH"
          gh workflow run container-security.yml --ref "$BRANCH"
