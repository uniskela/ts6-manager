name: PR validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript build, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ts6/backend exec prisma generate

      - name: Build common package
        run: pnpm --filter @ts6/common build

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Install Chromium for PWA tests
        run: pnpm --filter @ts6/frontend exec playwright install --with-deps chromium

      - name: Test production PWA
        run: pnpm --filter @ts6/frontend test

      - name: Run backend tests
        working-directory: packages/backend
        shell: bash
        run: |
          mapfile -t tests < <(find src -type f -name '*.test.ts' | sort)
          if (( ${#tests[@]} == 0 )); then
            echo 'No backend tests found.' >&2
            exit 1
          fi
          printf 'Running %d backend test files\n' "${#tests[@]}"
          pnpm exec tsx --test "${tests[@]}"

  sidecar:
    name: Go sidecar test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sidecar

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: packages/sidecar/go.mod
          cache-dependency-path: packages/sidecar/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
