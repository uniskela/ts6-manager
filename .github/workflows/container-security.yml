name: Container security release gate

on:
  pull_request:
    paths:
      - '.github/workflows/container-security.yml'
      - '.yt-dlp-version'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'Dockerfile.sidecar'
      - 'Dockerfile.all-in-one'
      - 'docker-commands/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/backend/package.json'
      - 'packages/backend/prisma.config.mjs'
      - 'packages/frontend/package.json'
      - 'packages/common/package.json'
      - 'packages/sidecar/go.mod'
      - 'packages/sidecar/go.sum'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/container-security.yml'
      - '.yt-dlp-version'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'Dockerfile.sidecar'
      - 'Dockerfile.all-in-one'
      - 'docker-commands/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/backend/package.json'
      - 'packages/backend/prisma.config.mjs'
      - 'packages/frontend/package.json'
      - 'packages/common/package.json'
      - 'packages/sidecar/go.mod'
      - 'packages/sidecar/go.sum'
  schedule:
    # Re-scan current release images weekly so newly disclosed vulnerabilities
    # are caught even when no Docker or dependency files changed.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
          - component: frontend
            dockerfile: Dockerfile.frontend
          - component: sidecar
            dockerfile: Dockerfile.sidecar
          - component: all-in-one
            dockerfile: Dockerfile.all-in-one

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build final image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ts6-security-${{ matrix.component }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=security-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.component }}

      - name: Validate pruned Node runtime
        if: matrix.component == 'backend' || matrix.component == 'all-in-one'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ts6-security-${{ matrix.component }}:${{ github.sha }}"

          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu
            ! command -v npm
            ! command -v npx
            ! command -v pnpm
            ! command -v corepack
            test ! -e /usr/local/lib/node_modules/npm
            test ! -e /usr/local/lib/node_modules/corepack
            test -f /app/packages/backend/node_modules/prisma/build/index.js
            test -f /app/packages/backend/prisma.config.mjs
            test -f /app/packages/backend/generated/prisma/index.js
            test ! -e /app/packages/backend/node_modules/.bin/esbuild
          '

          EXPECTED_YT_DLP_VERSION="$(tr -d '[:space:]' < .yt-dlp-version)"
          ACTUAL_YT_DLP_VERSION="$(docker run --rm --entrypoint yt-dlp "$IMAGE" --version | tr -d '[:space:]')"
          if [[ "$ACTUAL_YT_DLP_VERSION" != "$EXPECTED_YT_DLP_VERSION" ]]; then
            echo "Expected yt-dlp $EXPECTED_YT_DLP_VERSION, got $ACTUAL_YT_DLP_VERSION" >&2
            exit 1
          fi
          echo "Validated pinned yt-dlp: $ACTUAL_YT_DLP_VERSION"

          docker run --rm --entrypoint sh             -e DATABASE_URL=file:/tmp/runtime-smoke.db             "$IMAGE" -c '
              set -eu
              cd /app/packages/backend
              /usr/local/bin/apply-schema.sh
              test -s /tmp/runtime-smoke.db
            '

      - name: Record full vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ts6-security-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-${{ matrix.component }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m

      - name: Show all high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ts6-security-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.component }}-${{ github.sha }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Gate on fixable high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ts6-security-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m
