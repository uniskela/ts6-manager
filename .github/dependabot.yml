version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Australia/Sydney
    # Split groups so Dependabot cannot open one 30+ package PR.
    # Specific groups first; packages matching none open individually.
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
        update-types:
          - "minor"
          - "patch"
      lucide:
        patterns:
          - "lucide-react"
        update-types:
          - "minor"
          - "patch"
      workbox:
        patterns:
          - "workbox-*"
        update-types:
          - "minor"
          - "patch"
      backend-runtime:
        patterns:
          - "express"
          - "helmet"
          - "ws"
          - "libsodium-wrappers-sumo"
          - "cors"
          - "multer"
          - "pino"
          - "pino-pretty"
          - "ssh2"
          - "jsonwebtoken"
          - "express-rate-limit"
          - "node-cron"
          - "nanoid"
          - "bcryptjs"
          - "dotenv"
          - "zod"
          - "@prisma/*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"
      frontend-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"
      frontend-app:
        patterns:
          - "@tanstack/*"
          - "@hookform/*"
          - "react-hook-form"
          - "zustand"
          - "date-fns"
          - "axios"
          - "recharts"
          - "sonner"
          - "react-router-dom"
          - "@dnd-kit/*"
        update-types:
          - "minor"
          - "patch"
      npm-tooling:
        patterns:
          - "tsx"
          - "typescript"
          - "@types/*"
          - "autoprefixer"
          - "postcss"
          - "tailwindcss"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-pwa"
        update-types:
          - "minor"
          - "patch"
    # Block all npm majors; deliberate upgrades tracked in Issue #70 (1.8+).
    # Named package ignores from #93 are superseded by this ecosystem-wide rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: "/packages/sidecar"
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
