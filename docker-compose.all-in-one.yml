# One container: UI (nginx :80) + API (:3001) + sidecar (:9800) on loopback.
# Adapted from upstream PR #64 by @joaobosconff.

services:
  ts6:
    image: ghcr.io/uniskela/ts6-manager/all-in-one:latest
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    container_name: ts6-all-in-one
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/packages/backend/data/ts6webui.db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or environment}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env or environment}
      - SIDECAR_SECRET=${SIDECAR_SECRET:?Set SIDECAR_SECRET in .env or environment}
      - TS_ALLOW_SELF_SIGNED=${TS_ALLOW_SELF_SIGNED:-false}
      - YT_COOKIE_FILE=${YT_COOKIE_FILE:-}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MUSIC_DIR=/data/music
      - SIDECAR_URL=http://127.0.0.1:9800
      - SIDECAR_PORT=9800
      # Optional browser WebRTC preview — set WEBRTC_NAT1TO1_IP to a reachable host IP
      # and uncomment the UDP mapping below (see docs/video-streaming.md).
      # - WEBRTC_UDP_PORT=${WEBRTC_UDP_PORT:-10000}
      # - WEBRTC_NAT1TO1_IP=${WEBRTC_NAT1TO1_IP}
    volumes:
      - backend-data:/app/packages/backend/data
      - music-data:/data/music
    # Optional: VAAPI hardware video encoding (Intel/AMD GPU). See docs/video-streaming.md.
    # devices:
    #   - /dev/dri:/dev/dri
    ports:
      # Sidecar HTTP (:9800) and backend (:3001) are intentionally not published
      - "${HOST_PORT:-3000}:80"
      # - "${WEBRTC_UDP_PORT:-10000}:${WEBRTC_UDP_PORT:-10000}/udp"

volumes:
  backend-data:
    driver: local
  music-data:
    driver: local
