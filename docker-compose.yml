version: '3.8'

services:
  backend:
    image: uniskela/ts6-manager:backend
    container_name: ts6-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/packages/backend/data/ts6webui.db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or environment}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env or environment}
      - TS_ALLOW_SELF_SIGNED=${TS_ALLOW_SELF_SIGNED:-false}
      - YT_COOKIE_FILE=${YT_COOKIE_FILE:-}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MUSIC_DIR=/data/music
      - SIDECAR_URL=http://ts6-sidecar:9800
      - SIDECAR_SECRET=${SIDECAR_SECRET:?Set SIDECAR_SECRET in .env or environment}
      - SIDECAR_BINARY_PATH=${SIDECAR_BINARY_PATH:-}
    volumes:
      - backend-data:/app/packages/backend/data
      - music-data:/data/music
      # Optional: mount YouTube cookies file for yt-dlp
      # - ./cookies.txt:/app/cookies.txt
    ports:
      - "3001:3001"
    depends_on:
      - sidecar
    networks:
      - ts6-network

  sidecar:
    image: uniskela/ts6-manager:sidecar
    container_name: ts6-sidecar
    restart: unless-stopped
    environment:
      - SIDECAR_PORT=9800
      - SIDECAR_SECRET=${SIDECAR_SECRET:?Set SIDECAR_SECRET in .env or environment}
    # Port 9800 is intentionally NOT published — backend reaches sidecar on the internal network only
    networks:
      - ts6-network

  frontend:
    image: uniskela/ts6-manager:frontend
    container_name: ts6-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ts6-network

volumes:
  backend-data:
    driver: local
  music-data:
    driver: local

networks:
  ts6-network:
    driver: bridge
