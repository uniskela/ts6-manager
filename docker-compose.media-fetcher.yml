# Isolated radio fetcher overlay. Do not use as the only compose file.
# Fetcher requires Landlock ABI >= 4 (Linux 6.7+). It will not start without it.
#   docker compose -f docker-compose.yml -f docker-compose.media-fetcher.yml up
# Backend stays on ts6-network only. Fetcher stays on ts6_fetch only.
# No published fetcher/proxy ports. No Docker socket. No extra capabilities.
#
# Create a token file (32+ hex) before starting:
#   umask 077; openssl rand -hex 32 > .media-fetcher-token
# Rootless named volumes may be root-owned; if bind fails:
#   docker compose -f docker-compose.yml -f docker-compose.media-fetcher.yml \
#     run --rm --user 0 media-fetcher chown -R node:node /jobs /ctl

services:
  backend:
    environment:
      - MEDIA_FETCHER=1
      - MEDIA_FETCHER_SOCK=/jobs/jobs.sock
      - MEDIA_FETCHER_TOKEN_FILE=/run/media-fetcher-token
    volumes:
      - ts6-jobs:/jobs
      - ${MEDIA_FETCHER_TOKEN_FILE:-./.media-fetcher-token}:/run/media-fetcher-token:ro
    depends_on:
      - media-fetcher

  media-egress-proxy:
    build:
      context: ./services/media-fetcher
      dockerfile: Dockerfile
    image: ts6-media-fetcher:local
    container_name: ts6-media-egress-proxy
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PROXY_CTL=/ctl/proxy.sock
      - PROXY_PORT=8080
    volumes:
      - ts6-ctl:/ctl
    command: ["node", "/app/proxy.mjs"]
    restart: unless-stopped
    networks:
      ts6_fetch:
      ts6_egress:

  media-fetcher:
    build:
      context: ./services/media-fetcher
      dockerfile: Dockerfile
    image: ts6-media-fetcher:local
    container_name: ts6-media-fetcher
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - JOBS_SOCK=/jobs/jobs.sock
      - PROXY_CTL=/ctl/proxy.sock
      - PROXY_HOST=media-egress-proxy
      - MEDIA_FETCHER_TOKEN_FILE=/run/media-fetcher-token
      - FETCHER_MAX_JOBS=4
    volumes:
      - ts6-jobs:/jobs
      - ts6-ctl:/ctl
      - ${MEDIA_FETCHER_TOKEN_FILE:-./.media-fetcher-token}:/run/media-fetcher-token:ro
    command: ["node", "/app/fetcher.mjs"]
    depends_on:
      - media-egress-proxy
    restart: unless-stopped
    networks:
      ts6_fetch:

volumes:
  ts6-jobs:
  ts6-ctl:

networks:
  ts6_fetch:
    internal: true
  ts6_egress:
