<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TS6 Manager" />
    <title>TeamSpeak 6 Manager</title>
    <script>
      // Apply persisted theme before React renders to prevent flash
      try {
        var stored = JSON.parse(localStorage.getItem('ts6-ui') || '{}');
        var theme = (stored.state && stored.state.theme) || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
